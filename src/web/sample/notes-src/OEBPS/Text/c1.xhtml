<h2>第一章</h2>
<p>　吾輩は猫である<a id="ref1" href="notes.xhtml#fn1" epub:type="noteref">［注1］</a>。名前はまだ無い。</p>
<p>　どこで生れたかとんと見当がつかぬ<a id="ref2" href="notes.xhtml#fn2" epub:type="noteref">［注2］</a>。</p>
<p>　何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。</p>
