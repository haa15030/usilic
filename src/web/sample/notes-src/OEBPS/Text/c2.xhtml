<h2>第二章</h2>
<p>　吾輩はここで始めて人間というものを見た<a id="r3" href="#n3">※3</a>。</p>
<p>　しかもあとで聞くとそれは書生という人間中で一番獰悪な種族であったそうだ<a id="r4" href="notes.xhtml#en4" epub:type="noteref">［注4］</a>。</p>
